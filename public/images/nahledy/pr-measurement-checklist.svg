<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Checklist pro nastavení měření PR">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e83792"/><stop offset="1" stop-color="#523792"/>
    </linearGradient>
    <style>
      .t { font-family: Poppins, 'Segoe UI', sans-serif; }
      .nadpis { font-size: 26px; font-weight: 700; fill: #2b1c56; }
      .polozka { font-size: 17px; font-weight: 500; fill: #221b3a; }
      .stitek { font-size: 13px; font-weight: 600; fill: #fff; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="8" fill="url(#g3)"/>

  <rect x="40" y="36" width="128" height="28" rx="14" fill="url(#g3)"/>
  <text class="t stitek" x="60" y="55">CHECKLIST</text>
  <text class="t nadpis" x="40" y="106">Než začnete měřit</text>

  <g>
    <rect x="40" y="138" width="560" height="48" rx="12" fill="#faf7fd"/>
    <rect x="58" y="150" width="24" height="24" rx="7" fill="url(#g3)"/>
    <path d="M64 162 l5 5 l9 -10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t polozka" x="98" y="169">Nejdřív cíle, teprve potom metriky</text>
  </g>
  <g>
    <rect x="40" y="194" width="560" height="48" rx="12" fill="#faf7fd"/>
    <rect x="58" y="206" width="24" height="24" rx="7" fill="url(#g3)"/>
    <path d="M64 218 l5 5 l9 -10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="t polozka" x="98" y="225">Změřte výchozí stav (baseline)</text>
  </g>
  <g>
    <rect x="40" y="250" width="560" height="48" rx="12" fill="#faf7fd"/>
    <rect x="58" y="262" width="24" height="24" rx="7" fill="#fff" stroke="#e83792" stroke-width="3"/>
    <text class="t polozka" x="98" y="281">Dohodněte KPI se stakeholdery předem</text>
  </g>

  <rect x="40" y="322" width="140" height="6" rx="3" fill="url(#g3)"/>
</svg>
